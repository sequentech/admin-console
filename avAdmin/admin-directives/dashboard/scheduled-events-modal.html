<div class="modal-header dialog-header-warning">
    <h4 class="modal-title">
      <span class="glyphicon glyphicon-warning-sign">
      </span>
      <span class="title" ng-i18next>
        avAdmin.dashboard.modals.configureScheduledEvents.header
      </span>
      <button type="button" class="close pull-right" ng-click="cancel()">×</button>
    </h4>
  </div>
  <div class="modal-body scheduled-events-modal">
    <p>
      <span ng-i18next>
        avAdmin.dashboard.modals.configureScheduledEvents.body
      </span>
    </p>
    <form role="form" class="form form-horizontal" name="elbasic_form">
      <!-- start_voting checkbox -->
      <label
        for="start-voting-enable"
        class="descriptive-checkbox"
        ng-class="{'disabled': !enabled.start_voting}"
      >
        <input
          id="start-voting-enable"
          type="checkbox"
          name="start-voting-enable"
          ng-model="enabled.start_voting"
        />
        <span
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.startVotingEnable">
        </span>
      </label>
      <!-- start_voting selector -->
      <label
        for="start-voting-selector"
        class="descriptive-selector"
        ng-class="{'disabled': !enabled.start_voting}"
      >
        <span 
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.startVotingSelector"
        ></span>
        <input
          id="start-voting-selector"
          ng-disabled="!enabled.start_voting"
          type="datetime-local"
          name="start-voting-selector"
          ng-model="scheduled_events.start_voting.event_at"
        />
      </label>
      <!-- end_voting checkbox -->
      <label
        for="end-voting-enable"
        class="descriptive-checkbox"
        ng-class="{'disabled': !enabled.end_voting}"
      >
        <input
          id="end-voting-enable"
          type="checkbox"
          name="end-voting-enable"
          ng-model="enabled.end_voting"
        />
        <span
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.endVotingEnable">
        </span>
      </label>
      <!-- end_voting selector -->
      <label
        for="end-voting-selector"
        class="descriptive-selector"
        ng-class="{'disabled': !enabled.end_voting}"
      >
        <span 
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.endVotingSelector"
        ></span>
        <input
          id="end-voting-selector"
          ng-disabled="!enabled.end_voting"
          type="datetime-local"
          name="end-voting-selector"
          ng-model="scheduled_events.end_voting.event_at"
        />
      </label>
      <!-- allow_tally checkbox -->
      <label
        for="allow-tally-enable"
        class="descriptive-checkbox"
        ng-class="{'disabled': !enabled.allow_tally}"
      >
        <input
          id="allow-tally-enable"
          type="checkbox"
          name="allow-tally-enable"
          ng-model="enabled.allow_tally"
        />
        <span
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.allowTallyEnable">
        </span>
      </label>
      <!-- allow_tally selector -->
      <label
        for="allow-tally-selector"
        class="descriptive-selector"
        ng-class="{'disabled': !enabled.allow_tally}"
      >
        <span 
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.allowTallySelector"
        ></span>
        <input
          id="allow-tally-selector"
          ng-disabled="!enabled.allow_tally"
          type="datetime-local"
          name="allow-tally-selector"
          ng-model="scheduled_events.allow_tally.event_at"
        />
      </label>
      <!-- tally checkbox -->
      <label
        for="tally-enable"
        class="descriptive-checkbox"
        ng-class="{'disabled': !enabled.tally}"
      >
        <input
          id="tally-enable"
          type="checkbox"
          name="tally-enable"
          ng-model="enabled.tally"
        />
        <span
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.tallyEnable">
        </span>
      </label>
      <!-- tally selector -->
      <label
        for="tally-selector"
        class="descriptive-selector"
        ng-class="{'disabled': !enabled.tally}"
      >
        <span 
          class="header"
          ng-i18next="avAdmin.dashboard.modals.configureScheduledEvents.tallySelector"
        ></span>
        <input
          id="tally-selector"
          ng-disabled="!enabled.tally"
          type="datetime-local"
          name="tally-selector"
          ng-model="scheduled_events.tally.event_at"
        />
      </label>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-success" ng-click="ok()" ng-i18next>
      avAdmin.dashboard.modals.configureScheduledEvents.confirm
    </button>
    <button class="btn btn-cancel" ng-click="cancel()" ng-i18next>
      avCommon.cancel
    </button>
  </div>
