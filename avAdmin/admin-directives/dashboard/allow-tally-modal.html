<div class="modal-header dialog-header-warning">
    <h4 class="modal-title">
      <span class="glyphicon glyphicon-warning-sign">
      </span>
      <span class="title" ng-i18next>
        avAdmin.dashboard.modals.{{dialogName}}.header
      </span>
      <button type="button" class="close pull-right" ng-click="cancel()">×</button>
    </h4>
  </div>
  <div class="modal-body">
    <p>
      <span ng-i18next>
        [html]avAdmin.dashboard.modals.{{dialogName}}.body
      </span>
      <textarea 
        ng-if="textarea.data"
        ng-model="textarea.data" 
        style="width: 100%; min-height: 300px">
      </textarea>

      <div class="start-date-container">
        <span ng-i18next>avAdmin.turnoutChart.startDate</span>
        <div moment-picker="scheduledDate" max-view="minute" class="date-edit"> 
            <span>{{ scheduledDate }}</span>
            <i class="fa fa-pencil"></i><br/>
        </div>
        <i class="fa fa-times" ng-if="scheduledDate" ng-click="clearScheduledDate()"></i><br/>
      </div>
    </p>
  </div>
  <div class="modal-footer">
    <button class="btn btn-success" ng-click="ok()" ng-i18next>
      avAdmin.dashboard.modals.{{dialogName}}.confirmButton
    </button>
    <button class="btn btn-cancel" ng-click="cancel()" ng-i18next>
      avCommon.cancel
    </button>
  </div>
